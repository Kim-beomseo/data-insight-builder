<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Grid lines -->
  <line x1="88" y1="140" x2="424" y2="140" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="88" y1="220" x2="424" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="88" y1="300" x2="424" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="88" y1="380" x2="424" y2="380" stroke="rgba(255,255,255,0.3)" stroke-width="4" />

  <!-- Bar 1 -->
  <rect x="116" y="270" width="48" height="110" rx="10" fill="url(#bar1)" />
  <!-- Bar 2 -->
  <rect x="194" y="210" width="48" height="170" rx="10" fill="url(#bar2)" />
  <!-- Bar 3 -->
  <rect x="272" y="150" width="48" height="230" rx="10" fill="url(#bar3)" />
  <!-- Bar 4 (Highlighted Korea/Target) -->
  <rect x="350" y="100" width="48" height="280" rx="10" fill="url(#bar4)" filter="url(#glow)" />

  <!-- Upward Trend Line -->
  <path d="M 140 250 Q 218 190 296 140 T 374 80" fill="none" stroke="url(#lineGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Trend Line Dots -->
  <circle cx="140" cy="250" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="4" />
  <circle cx="218" cy="190" r="7" fill="#ffffff" stroke="#34d399" stroke-width="4" />
  <circle cx="296" cy="140" r="7" fill="#ffffff" stroke="#fbbf24" stroke-width="4" />
  <circle cx="374" cy="80" r="9" fill="#ffffff" stroke="#f43f5e" stroke-width="5" filter="url(#glow)" />

  <!-- AI Sparkle Badge -->
  <path d="M 416 112 L 422 126 L 436 132 L 422 138 L 416 152 L 410 138 L 396 132 L 410 126 Z" fill="#fbbf24" />
  <path d="M 104 116 L 108 126 L 118 130 L 108 134 L 104 144 L 100 134 L 90 130 L 100 126 Z" fill="#38bdf8" />
</svg>
